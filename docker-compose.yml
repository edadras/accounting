# Development environment for the Finora backend (docs/04-roadmap.md, M0).
# `docker compose up -d` brings up everything the API expects.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: finora
      MYSQL_USER: finora
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports: ["3306:3306"]
    volumes: ["mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis:/data"]

  meilisearch:
    image: getmeili/meilisearch:v1.9
    environment:
      MEILI_MASTER_KEY: masterKeyForLocalDevelopment
      MEILI_NO_ANALYTICS: "true"
    ports: ["7700:7700"]
    volumes: ["meili:/meili_data"]

  # Object storage for receipts, contracts, voice notes.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: finora
      MINIO_ROOT_PASSWORD: secretsecret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]

  # Catches outgoing mail so nothing reaches a real inbox in development.
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  mysql:
  redis:
  meili:
  minio:
