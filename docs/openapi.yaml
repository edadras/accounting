      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - period
                - total
                - currency
              properties:
                period:
                  type: string
                  description: '`YYYY-MM`.'
                  pattern: '^\d{4}-(0[1-9]|1[0-2])$'
                total:
                  type: integer
                  minimum: 1
                  description: "INTEGER in the currency's minor units. 35000 with currency TRY is ₺350.00, not ₺35,000. Amount to divide across the units."
                currency:
                  type: string
                  enum:
                    - IRR
                    - IRT
                    - TRY
                    - USD
                    - EUR
                    - AED
                    - BTC
                    - ETH
                    - USDT
                    - XAU
                  description: 'Currency of `amount`.'
                due_date:
                  type: string
                  format: date
      security:
        -
          bearerAuth: []
      responses:
