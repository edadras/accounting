              rate:
                type:
                  - number
                  - 'null'
                description: 'Percentage, when the line came from a rate rather than a fixed amount.'
              sort_order:
                type: integer
        version:
          type: integer
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    TaxRuleSet:
      type: object
