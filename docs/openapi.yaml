  /api/v1/me:
    delete:
      operationId: scheduleAccountDeletion
      tags:
        - DataOps
      summary: 'Schedule account deletion'
      description: "Schedules deletion after a grace period rather than deleting now. `purge_after` is the point of no return — state it to the user before asking for the password, and use the server's value rather than computing it hopefully on the client. `POST /me/restore` cancels it while the window is open."
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  description: 'Account password. Required.'
      security:
        -
          bearerAuth: []
      responses:
        202:
          description: Scheduled.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [deletion_scheduled] }
                      grace_days: { type: integer }
                      requested_at: { type: string, format: date-time }
                      purge_after: { type: string, format: date-time, description: 'After this instant the deletion is irreversible.' }
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          description: '`incorrect_password`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        409:
          description: '`deletion_already_scheduled` — `details.purge_after` carries the existing date. Treat this as the pending state, not as a dead end.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
    get:
      operationId: getMe
      tags:
        - Core
      summary: 'Current user'
      description: 'Carries `deletion` while an account erasure is scheduled — null otherwise. Without it a client could only learn about a pending deletion from the answer to the DELETE that started it, so the grace-period warning disappeared as soon as the app was reopened.'
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'The authenticated user.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthenticated'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  /api/v1/me/restore:
    post:
      operationId: cancelAccountDeletion
      tags:
        - DataOps
      summary: 'Cancel a scheduled deletion'
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        -
          bearerAuth: []
      responses:
        200:
