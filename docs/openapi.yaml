      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
          description: 'ULID identifier.'
        role:
          type: string
          enum:
            - owner
            - admin
            - accountant
            - member
            - viewer
        joined_at:
          type:
            - string
            - 'null'
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    Invitation:
      type: object
      required:
        - id
        - email
        - role
        - status
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
          description: 'ULID identifier.'
        email:
          type: string
          format: email
          description: "The accepting user's email must match this, or holding the link would be enough to walk into a stranger's books."
        role:
          type: string
          enum:
            - admin
            - accountant
            - member
            - viewer
          description: 'Never `owner` — a workspace has exactly one, and allowing a second would let an admin lock the owner out.'
        status:
          type: string
          enum:
            - pending
            - accepted
            - revoked
            - expired
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        token:
          type:
            - string
            - 'null'
          description: 'Plain-text invitation token. Returned ONCE, from the create call only — the database stores a hash, so a leaked dump hands nobody a working link.'
    TwoFactorStatus:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        pending_confirmation:
          type: boolean
          description: 'Secret issued but not yet confirmed with a code.'
        confirmed_at:
          type:
            - string
            - 'null'
          format: date-time
        recovery_codes_remaining:
          type: integer
    SyncChange:
      type: object
      description: 'One record in the pull feed.'
      required:
        - entity
        - id
        - op
        - version
      properties:
        entity:
          type: string
          enum:
            - transaction
            - account
            - category
            - budget
        id:
          type: string
        op:
          type: string
          enum:
            - create
            - update
            - delete
        version:
          type: integer
        updated_at:
          type: string
          description: '`YYYY-MM-DDTHH:MM:SSZ`.'
        payload:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: "The entity's synced fields plus `id`, `version`, `updated_at`, `deleted_at`. Money fields inside a payload are bare integers in minor units with a sibling currency field, matching the columns."
    PushVerdict:
      type: object
      description: "The server's answer for one pushed change. A disagreement about an amount, currency, account or date is NEVER auto-resolved — it comes back as `conflict` for a person to settle. Non-financial fields merge last-write-wins."
      required:
        - entity
        - id
        - op
        - status
      properties:
        entity:
          type: string
        id:
          type: string
        op:
          type: string
        status:
          type: string
          enum:
            - applied
            - merged
            - conflict
            - rejected
        server_version:
          type: integer
        reason:
          type:
            - string
            - 'null'
          enum:
            - entity_missing
            - deleted_on_server
            - delete_vs_edit
            - financial_conflict
            - server_newer
            - not_applicable
            - null
          description: 'Why the change was not simply applied.'
        server_payload:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: "The server's version of the record. Present ONLY when `status` is `conflict`, because that is the only case where the client has to show a human both sides."
        message:
          type:
            - string
            - 'null'
          description: 'Present on `rejected`.'
    Device:
      type: object
