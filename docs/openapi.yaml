      tags:
        - Buildings
      summary: 'Issue charges for a period'
      description: "Divides `total` across the units using the building's formula. The parts sum to `total` exactly. Re-issuing a period that already has charges answers **200** with `meta.already_issued: true` instead of creating a second set — the safe answer to a double-tap."
