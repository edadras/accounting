        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
              properties:
                id:
                  type: string
                  minLength: 26
                  maxLength: 26
                  description: 'Optional client-generated ULID. Supplying it is what lets a record created offline keep the same id after it syncs.'
                type:
                  type: string
                  enum:
                    - check_due
                    - installment_due
                    - budget_threshold
                    - low_balance
                config:
                  type: object
                  additionalProperties: true
                  description: 'Type-specific settings, e.g. a balance floor for `low_balance`.'
                channels:
                  type: array
                  items:
                    type: string
                    enum:
                      - database
                      - push
                      - email
                      - sms
                      - telegram
                      - whatsapp
                  description: '`database` is appended by the server whatever you send, so an alert always has somewhere to land even if every external channel fails.'
                lead_days:
                  type: integer
                  description: 'How far ahead of the due date to fire.'
                  minimum: 0
                  maximum: 365
                is_active:
                  type: boolean
      security:
        -
          bearerAuth: []
      responses:
        201:
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
