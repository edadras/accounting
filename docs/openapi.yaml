      description: 'Returns three top-level keys, not the usual one: the subscription, what it entitles the workspace to, and what the workspace is currently using. Every limit in the product is read from `entitlements`, so this is the authoritative answer to "can I".'
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'Subscription, entitlements and usage.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Subscription'
                  entitlements:
                    $ref: '#/components/schemas/Entitlements'
                  usage:
                    type: object
                    description: 'Always exactly these four counters.'
                    properties:
                      workspaces: { type: integer }
                      accounts: { type: integer }
                      members: { type: integer }
                      budgets: { type: integer }
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/WorkspaceForbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
    post:
      operationId: changePlan
      tags:
        - Billing
      summary: 'Change plan'
      description: "Downgrading below what the workspace already uses is refused with `downgrade_blocked`, listing each violated limit — the alternative would be deleting the user's data to make it fit."
