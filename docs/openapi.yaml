      operationId: payAllowance
      tags:
        - Family
      summary: 'Pay an allowance'
      description: 'Paying the same member twice for the same period is refused with `409 allowance_already_paid`, which is what stops a double-tap becoming a double payment.'
      parameters:
        -
          name: member
          in: path
          required: true
          schema:
            type: string
          description: 'ULID identifier.'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payer_member_id
                - period
              properties:
                payer_member_id:
                  type: string
                  minLength: 26
                  maxLength: 26
                  description: 'Family member paying — must not be the recipient.'
                period:
                  type: string
                  description: '`YYYY-MM`.'
                  minLength: 7
                  maxLength: 7
                amount:
                  type: integer
                  minimum: 1
                  description: "INTEGER in the currency's minor units. 35000 with currency TRY is ₺350.00, not ₺35,000. Defaults to the member's configured monthly allowance."
