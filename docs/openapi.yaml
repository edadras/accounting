          description: 'Filter by state.'
        -
          name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 'Runs whose period ends on or after this date.'
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'A page of runs with their totals.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayrollRun'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/WorkspaceForbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createPayrollRun
      tags:
        - Payroll
      summary: 'Create a draft run'
      description: |-
        Calculates every payslip and posts nothing. An employee whose employment ended before the period is excluded even if listed explicitly, and someone who started or left mid-period is prorated by worked days.

        `net` is `gross` minus `deductions`, exactly, in integer minor units. Employer contributions are not subtracted from net; they are in `employer_cost`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - period_start
                - period_end
                - account_id
              properties:
                id:
                  type: string
                  minLength: 26
                  maxLength: 26
                  description: 'Optional client-generated ULID. Supplying it is what lets a record created offline keep the same id after it syncs.'
                reference:
                  type: string
                  maxLength: 64
                period_start:
                  type: string
                  format: date
                period_end:
                  type: string
                  format: date
                  description: 'Must not precede `period_start`.'
                pay_date:
                  type: string
                  format: date
                currency:
                  type: string
                  enum:
                    - IRR
                    - IRT
                    - TRY
                    - USD
                    - EUR
                    - AED
                    - BTC
                    - ETH
                    - USDT
                    - XAU
                  description: 'Defaults to the workspace base currency.'
                account_id:
                  type: string
                  minLength: 26
                  maxLength: 26
                  description: 'The account net pay is drawn from when the run is approved.'
                category_id:
                  type: string
                  minLength: 26
                  maxLength: 26
                  description: 'Category for the posted expense.'
                employee_ids:
                  type: array
                  maxItems: 1000
                  items:
                    type: string
                    minLength: 26
                    maxLength: 26
                  description: 'Omit for everyone employed during the period. A leaver is excluded either way.'
                adjustments:
                  type: object
                  description: 'Keyed by employee id — one-off earnings and deductions for this run only.'
                  additionalProperties:
                    type: object
                    properties:
                      earnings: { type: array, maxItems: 50, items: { type: object, required: [amount], properties: { code: { type: string, maxLength: 64 }, label: { type: string, maxLength: 255 }, amount: { type: integer, description: 'INTEGER minor units.', minimum: 0 } } } }
                      deductions: { type: array, maxItems: 50, items: { type: object, required: [amount], properties: { code: { type: string, maxLength: 64 }, label: { type: string, maxLength: 255 }, amount: { type: integer, description: 'INTEGER minor units.', minimum: 0 } } } }
                notes:
                  type: string
                  maxLength: 5000
      security:
        -
          bearerAuth: []
      responses:
        201:
          description: 'Draft created with its payslips. Nothing has been posted.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/PayrollRun'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
