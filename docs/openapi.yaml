          description: 'Sanctum plain-text token. Shown once — it is not retrievable later.'
        user:
          $ref: '#/components/schemas/User'
        workspace:
          allOf:
            - $ref: '#/components/schemas/Workspace'
          description: 'Register only: the workspace seeded for the new account.'
        workspaces:
          type: array
          description: 'Login only: every workspace the user belongs to. Pick one and send its id as `X-Workspace-Id`.'
          items:
            $ref: '#/components/schemas/Workspace'
    Member:
      type: object
      required:
        - id
