          type:
            - string
            - 'null'
          format: date-time
        payslip_count:
          type: integer
        payslips:
          type: array
          description: 'Only when the relation was loaded.'
          items:
            $ref: '#/components/schemas/Payslip'
        notes:
          type:
            - string
            - 'null'
        version:
          type: integer
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    Payslip:
      type: object
      required:
        - id
        - payroll_run_id
        - employee_id
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
          description: 'ULID identifier.'
        payroll_run_id:
          type: string
          minLength: 26
          maxLength: 26
          description: 'ULID identifier.'
        employee_id:
          type: string
          minLength: 26
          maxLength: 26
          description: 'ULID identifier.'
        gross:
          $ref: '#/components/schemas/Money'
        deductions:
          $ref: '#/components/schemas/Money'
        contributions:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
        employer_cost:
          $ref: '#/components/schemas/Money'
        period_days:
          type: integer
        worked_days:
          type: integer
