openapi: 3.1.0
info:
  title: 'Finora API'
  version: 1.0.0
  summary: 'Personal and small-business financial operating system.'
  description: |-
    REST API for Finora. Conventions below are the ones in
    `docs/05-api-conventions.md`; where the implementation differs from that
    document, this spec describes the implementation, and the difference is
    called out on the schema concerned.

    ## Money — read this before anything else

    **Every monetary amount in this API is an integer number of the
    currency's minor units.** It is never a decimal and never a float.

    `35000` with currency `TRY` is **₺350.00**, not ₺35,000.
    `35000` with currency `IRR` is **35,000 rials**, because IRR has zero
    decimal places.

    The number of decimal places is carried alongside the amount as
    `minor_unit`, because it is the single fact that makes the integer
    interpretable: `USD`/`TRY`/`EUR`/`AED`/`USDT` are 2, `IRR`/`IRT` are 0,
    `XAU` is 4, `BTC`/`ETH` are 8. Do not hard-code 2.

    In **responses**, money is normally an object — see the `Money` schema —
    carrying the integer, the currency, the minor unit and a display-only
    decimal string. In **requests**, money is a bare integer field (usually
    `amount`) with the currency in a sibling `currency` field.

    The `decimal` and `formatted` strings are for display only. Never parse
    them back into a number and never compute with them.

    ## Authentication

    `Authorization: Bearer <token>` — a Laravel Sanctum personal access
    token from `POST /auth/login`, or from `POST /auth/2fa/verify` when the
    account has two-factor confirmed (in that case login returns a challenge
    instead of a token).

    ## Workspace scoping

    Most endpoints operate inside one workspace and require
    `X-Workspace-Id: <ulid>`. Every such operation lists the header
    explicitly. Omitting it is `400 workspace_required`; sending the id of a
    workspace the caller is not a member of is `403 workspace_forbidden` —
    deliberately the same answer as a workspace that does not exist, so the
    endpoint cannot be used to discover which ids are real.

    The endpoints that must not require it are the ones that establish
    workspace context in the first place: `/auth/*`, `/me`, `/workspaces`,
    `/invitations/{token}/accept`, `/me/security-log`, `/me/restore`,
    `DELETE /me`, and the public `/translations/{locale}`.

    ## Idempotency

    `Idempotency-Key: <ulid>` on writes. It is honoured today by the write
    paths that create financial records — `POST /transactions`,
    `POST /investments/{id}/trades`, `POST /building-charges/{charge}/pay` —
    where the header takes precedence over any `idempotency_key` field in
    the body. Sending it on other writes is harmless and forward-compatible.

    ## Errors

    Domain refusals answer with a stable, machine-readable, always-English
    `code`; the `message` is prose for a developer, not for a user. Clients
    are expected to translate from the `code`.

    ```json
    {
      "error": {
        "code": "currency_mismatch",
        "message": "Transaction currency USD does not match the account currency TRY.",
        "details": { "given": "USD", "expected": "TRY" },
        "request_id": "01J..."
      }
    }
    ```

    Two caveats about the real behaviour, both worth knowing before writing
    a client error handler:

    1. **Laravel validation failures do not use this envelope.** A `422`
       from the framework's validator is `{"message": "...", "errors":
       {"field": ["..."]}}`. Handle both shapes.
    2. **Some `403`s and `404`s do not use it either.** Bare permission
       aborts and `findOrFail` misses return Laravel's default
       `{"message": "..."}` body. Only refusals raised as domain exceptions
       carry a `code`.

    ## Identifiers, times, pagination

    - Ids are **ULIDs** as 26-character strings. Many create endpoints accept
      a client-generated `id`, which is what makes offline-created records
      survive sync.
    - Timestamps are **ISO-8601 in UTC**. The sync endpoints use the
      stricter `YYYY-MM-DDTHH:MM:SSZ` form.
    - Paginated lists answer `{"data": [...], "meta": {"page", "per_page",
      "total"}}`. `per_page` defaults to 50 and is capped at 200. Not every
      list endpoint paginates — the ones that do are marked.
    - The sync feed is cursor-based instead, with an opaque `next_cursor`.

    ## Generation

    This document is generated from `php artisan route:list --json` by
    `backend/scripts/build-api-docs.php`, which refuses to write if a live
    route is undescribed or a described route no longer exists.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: 'http://localhost:8000'
    description: 'Local development server'
tags:
  - name: AI
    description: 'Natural-language capture, receipt and voice drafts, chat and insights. Nothing is posted to the ledger without an explicit confirm call.'
  - name: Alerts
    description: 'Alert rules, delivered alerts, and per-channel delivery preferences.'
  - name: Assets
    description: 'Owned assets and their depreciation schedules.'
  - name: Audit
    description: "Append-only workspace audit trail and the caller's own security log."
  - name: Banking
    description: 'Banks, cheques and loans with generated instalment schedules.'
  - name: Billing
    description: 'Plans, subscriptions, trials and subscription invoices.'
  - name: Budget
    description: 'Budgets across six scopes, and live budget status.'
  - name: Buildings
    description: 'Buildings, units, charge issuance and collection, and building reports.'
  - name: Business
    description: 'Contacts, projects, sales/purchase invoices and payments.'
  - name: Capture
    description: 'Inbound capture channels: text, bank SMS, QR and email. All produce drafts.'
  - name: Core
    description: 'Authentication, workspaces, members and invitations.'
  - name: DataOps
    description: 'Workspace data export and account deletion.'
  - name: Documents
    description: 'File uploads and polymorphic attachment to ledger records.'
  - name: Family
    description: 'Family members, spending caps and allowances.'
  - name: I18n
    description: 'Translation dictionary, served per locale with delta support.'
  - name: Investment
    description: 'Investment positions, trades and performance.'
  - name: Ledger
    description: 'Accounts, categories and double-entry transactions. The core of the product.'
  - name: MarketData
    description: 'Exchange rates and instrument prices.'
  - name: Payroll
    description: Payroll
  - name: Recurring
    description: 'Recurring transaction rules.'
  - name: Reports
    description: 'Financial reports and their exports.'
  - name: Search
    description: 'Lexical and semantic search across the workspace.'
  - name: Security
    description: 'Two-factor authentication and password reset.'
  - name: Sync
    description: 'Offline-first delta sync and device registration.'
  - name: Travel
    description: 'Trips, split expenses and settlement.'
security:
  -
    bearerAuth: []
paths:
  /api/v1/accounts:
    get:
      operationId: listAccounts
      tags:
        - Ledger
      summary: 'List accounts'
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        -
          name: include_archived
          in: query
          required: false
          schema:
            type: boolean
          description: 'Include archived accounts.'
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'Accounts, with the workspace total.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  meta:
                    type: object
                    properties:
                      total: { allOf: [{ $ref: '#/components/schemas/MoneyBrief' }], description: 'Sum of every listed balance, converted to the workspace base currency.' }
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/WorkspaceForbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createAccount
      tags:
        - Ledger
      summary: 'Create an account'
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
                - currency
              properties:
                id:
                  type: string
                  minLength: 26
                  maxLength: 26
                  description: 'Optional client-generated ULID. Supplying it is what lets a record created offline keep the same id after it syncs.'
                name:
                  type: string
                  maxLength: 120
                type:
                  type: string
                  enum:
                    - cash
                    - bank
                    - card
                    - wallet
                    - fund
                    - petty_cash
                    - crypto
                    - gold
                    - fx
                currency:
                  type: string
                  enum:
                    - IRR
                    - IRT
                    - TRY
                    - USD
                    - EUR
                    - AED
                    - BTC
                    - ETH
                    - USDT
                    - XAU
                  description: 'Currency this account holds. Cannot be changed later.'
                opening_balance:
                  type: integer
                  description: 'INTEGER in minor units. May be negative for a liability account.'
                iban:
                  type: string
                  maxLength: 34
                card_last4:
                  type: string
                  minLength: 4
                  maxLength: 4
                icon:
                  type: string
                  maxLength: 64
                color:
                  type: string
                  maxLength: 16
      security:
        -
          bearerAuth: []
      responses:
        201:
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  '/api/v1/accounts/{id}':
    get:
      operationId: getAccount
      tags:
        - Ledger
      summary: 'Get an account'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          description: 'ULID identifier.'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'The account.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/WorkspaceForbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  /api/v1/ai/chat:
    post:
      operationId: aiChat
      tags:
        - AI
      summary: 'Ask the assistant'
      description: "Tool-calling chat over the workspace's own data. The workspace id is injected server-side and stripped from any tool arguments the model produces, so a prompt injected into a transaction description cannot redirect a query at another workspace. `redacted` lists what was removed."
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question
              properties:
                question:
                  type: string
                  maxLength: 2000
                conversation_id:
                  type: string
                  description: 'Continue an existing conversation.'
                  maxLength: 64
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'The answer and how it was reached.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      conversation_id: { type: string }
                      answer: { type: string }
                      tool_calls: { type: array, items: { type: string } }
                      sources: { type: array, items: { type: object, additionalProperties: true } }
                      redacted: { type: array, items: { type: string }, description: "Arguments stripped from the model's tool calls before execution." }
                      provider: { type: string }
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          description: '`ai_disabled`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
        503:
          $ref: '#/components/responses/ServiceUnavailable'
  '/api/v1/ai/conversations/{id}':
    delete:
      operationId: deleteAiConversation
      tags:
        - AI
      summary: 'Delete a conversation'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          description: 'ULID identifier.'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        -
          bearerAuth: []
      responses:
        204:
          description: Deleted.
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/WorkspaceForbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
    get:
      operationId: getAiConversation
      tags:
        - AI
      summary: 'Get a conversation'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          description: 'ULID identifier.'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'The conversation and its messages.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      title: { type: [string, 'null'] }
                      messages: { type: array, items: { type: object, properties: { id: { type: string }, role: { type: string, enum: [user, assistant, tool] }, content: { type: [string, 'null'] }, tool_name: { type: [string, 'null'] }, created_at: { type: string, format: date-time } } } }
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/WorkspaceForbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  /api/v1/ai/drafts:
    get:
      operationId: listAiDrafts
      tags:
        - AI
      summary: 'List drafts'
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        -
          name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - confirmed
              - discarded
          description: ''
        -
          name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 200
          description: 'Default 50, maximum 200.'
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: Drafts.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiDraft'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/WorkspaceForbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createAiDraft
      tags:
        - AI
      summary: 'Draft a transaction from text'
      description: 'Turns a sentence into a proposed transaction. It is a PROPOSAL — nothing reaches the ledger until `POST /ai/drafts/{id}/confirm`.'
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  description: 'Natural language, e.g. "45 lira on lunch yesterday".'
                  maxLength: 2000
      security:
        -
          bearerAuth: []
      responses:
        201:
          description: Drafted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/AiDraft'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          description: '`ai_disabled`, or the caller cannot write.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
        503:
          $ref: '#/components/responses/ServiceUnavailable'
  '/api/v1/ai/drafts/{id}':
    get:
      operationId: getAiDraft
      tags:
        - AI
      summary: 'Get a draft'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          description: 'ULID identifier.'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'The draft.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/AiDraft'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/WorkspaceForbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  '/api/v1/ai/drafts/{id}/confirm':
    post:
      operationId: confirmAiDraft
      tags:
        - AI
      summary: 'Confirm a draft into the ledger'
      description: 'The only path from a draft to a real transaction. Any field sent here overrides what was extracted, so a user can correct the machine before anything is written. Confirming twice is `409 ai_draft_already_resolved`.'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          description: 'ULID identifier.'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                  minLength: 26
                  maxLength: 26
                  description: "Account to post to, overriding the draft's suggestion."
                category_id:
                  type:
                    - string
                    - 'null'
                  description: 'Category, overriding the suggestion.'
                amount:
                  type: integer
                  minimum: 1
                  description: "INTEGER in the currency's minor units. 35000 with currency TRY is ₺350.00, not ₺35,000. Overrides the extracted amount."
                currency:
                  type: string
                  description: 'Overrides the extracted currency.'
                occurred_at:
                  type: string
                  format: date-time
                description:
                  type:
                    - string
                    - 'null'
                type:
                  type: string
                  enum:
                    - income
                    - expense
      security:
        -
          bearerAuth: []
      responses:
        201:
          description: Posted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Transaction'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/WorkspaceForbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  '/api/v1/ai/drafts/{id}/discard':
    post:
      operationId: discardAiDraft
      tags:
        - AI
      summary: 'Discard a draft'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          description: 'ULID identifier.'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: Discarded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/AiDraft'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/WorkspaceForbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  /api/v1/ai/insights:
    get:
      operationId: listAiInsights
      tags:
        - AI
      summary: 'List insights'
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        -
          name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - spending_composition
              - period_change
              - spending_anomaly
              - cashflow_forecast
          description: ''
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'Active insights, newest first.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiInsight'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/WorkspaceForbidden'
