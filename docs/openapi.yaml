  /api/v1/market/rates:
    get:
      operationId: getMarketRates
      tags:
        - MarketData
      summary: 'Exchange rate'
      description: 'Latest stored rate plus recent history. A rate that is zero, negative, non-numeric or more than ten times the previous one is rejected on ingest rather than stored, because a bad rate applied silently re-values every multi-currency balance in the product. If nothing is stored, a resolver fallback answers with `source: "fallback"`.'
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        -
          name: base
          in: query
          required: false
          schema:
            type: string
            enum:
              - IRR
              - IRT
              - TRY
              - USD
              - EUR
              - AED
              - BTC
              - ETH
              - USDT
              - XAU
          description: 'Defaults to the configured base.'
        -
          name: quote
          in: query
          required: false
          schema:
            type: string
            enum:
              - IRR
              - IRT
              - TRY
              - USD
              - EUR
              - AED
              - BTC
              - ETH
              - USDT
              - XAU
          description: 'Defaults to the workspace base currency.'
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'The rate and its history.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      base: { type: string }
                      quote: { type: string }
                      rate: { type: [string, 'null'], description: 'Decimal STRING, not a number — the precision is preserved rather than being handed to a float.' }
                      source: { type: [string, 'null'] }
                      rated_at: { type: [string, 'null'], format: date-time }
                      history: { type: array, items: { type: object, properties: { rate: { type: string }, source: { type: string }, rated_at: { type: [string, 'null'], format: date-time } } } }
                  meta:
                    type: object
                    properties:
                      request_id: { type: [string, 'null'] }
        400:
