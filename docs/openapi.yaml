    post:
      operationId: createWorkspace
      tags:
        - Core
      summary: 'Create a workspace'
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
                - base_currency
              properties:
                name:
                  type: string
                  maxLength: 120
                type:
                  type: string
                  enum:
                    - personal
                    - business
                    - building
                    - travel
                    - family
                    - store
                base_currency:
                  type: string
                  enum:
                    - IRR
                    - IRT
                    - TRY
                    - USD
                    - EUR
                    - AED
                    - BTC
                    - ETH
                    - USDT
                    - XAU
                  description: 'Every report and every `base` amount in this workspace is stated in this currency.'
                locale:
                  type: string
                  enum:
                    - fa
                    - en
                    - tr
                    - ar
                timezone:
                  type: string
                  description: 'Default `Asia/Tehran`.'
                  maxLength: 64
      security:
        -
          bearerAuth: []
      responses:
        201:
          description: 'Created, with the caller as owner.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Workspace'
        401:
          $ref: '#/components/responses/Unauthenticated'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Laravel Sanctum personal access token, returned by `POST /api/v1/auth/login` (or `POST /api/v1/auth/2fa/verify` when two-factor is confirmed). Send as `Authorization: Bearer <token>`.'
  parameters:
    WorkspaceId:
      name: X-Workspace-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 26
        maxLength: 26
      example: 01J8ZQ7X0000000000000WSPCE
      description: 'ULID of the workspace this request operates in. Membership is verified on every request. Missing → `400 workspace_required`; not a member (or no such workspace) → `403 workspace_forbidden`.'
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum:
          - fa
          - en
          - tr
          - ar
        default: fa
      description: 'Preferred language for human-readable text. Error `code` values are always English regardless.'
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
      description: 'Correlation id. Echoed back as `error.request_id` (and in `meta.request_id` where the endpoint emits one), which is what makes a user-reported failure findable in the logs.'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
      description: 'Retry-safety key for writes. Where it is honoured (see the "Idempotency" section of the description) a repeat with the same key returns the original record instead of creating a second one, and the header wins over any `idempotency_key` field in the body.'
    DeviceId:
      name: X-Device-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
      description: 'Calling device. Also accepted as a `device_id` body/query field; the field is read first, then this header.'
  responses:
    Unauthenticated:
      description: 'No token, or a token that is expired or revoked.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthenticated
              message: 'Human-readable explanation, in English, for a developer.'
              request_id: 01J8ZQ7X0000000000000RQIDX
    WorkspaceRequired:
      description: 'The `X-Workspace-Id` header was missing or blank.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: workspace_required
              message: 'Human-readable explanation, in English, for a developer.'
              request_id: 01J8ZQ7X0000000000000RQIDX
    WorkspaceForbidden:
      description: 'The caller is not a member of that workspace — or it does not exist. The two are answered identically on purpose, so the endpoint cannot be used to probe which workspace ids are real.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: workspace_forbidden
              message: 'Human-readable explanation, in English, for a developer.'
              request_id: 01J8ZQ7X0000000000000RQIDX
    Forbidden:
      description: 'The caller''s role does not permit this action. Note that role checks raised by a bare abort return Laravel''s default `{"message": "..."}` body rather than the error envelope.'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/FrameworkError'
    NotFound:
      description: 'No such record in this workspace. Records looked up with `findOrFail` answer with Laravel''s default `{"message": "..."}` body; those raised as domain exceptions carry a `code` such as `account_not_found`.'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/FrameworkError'
    ValidationFailed:
      description: 'The request body or query failed validation. **Two shapes are possible.** Laravel''s validator answers `{"message", "errors"}`; a domain rule that refuses after validation passed answers the `{"error": {"code", ...}}` envelope with a code such as `currency_mismatch`, `zero_amount` or `negative_amount`.'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ValidationError'
              - $ref: '#/components/schemas/Error'
    Conflict:
      description: 'The request conflicts with current state — for example a duplicate invoice number, an allowance already paid for the period, or a draft that was already resolved.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: conflict
              message: 'Human-readable explanation, in English, for a developer.'
              request_id: 01J8ZQ7X0000000000000RQIDX
    RateLimited:
      description: 'Too many requests. `docs/05-api-conventions.md` §10 sets the intended budgets: 5/min per IP for auth, 120/min per user generally, 60/min per device for sync, and a plan-dependent daily allowance for AI and OCR. `X-RateLimit-Limit` and `X-RateLimit-Remaining` accompany responses.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limited
              message: 'Too many requests.'
              request_id: 01J8ZQ7X0000000000000RQIDX
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: 'Requests permitted in the window.'
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: 'Requests left in the window.'
    ServerError:
      description: 'Unhandled failure. A few domain invariants also surface here rather than as a client error, because they mean the server produced something impossible: `unbalanced_transaction` and `inconsistent_invoice_totals` are 500 by design — the request was valid and the books still did not add up.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: server_error
              message: 'Human-readable explanation, in English, for a developer.'
              request_id: 01J8ZQ7X0000000000000RQIDX
    ServiceUnavailable:
      description: 'A dependency the request needs is not reachable — an AI or OCR provider, or a market data source.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: service_unavailable
              message: 'Human-readable explanation, in English, for a developer.'
              request_id: 01J8ZQ7X0000000000000RQIDX
              details:
                provider: openai
  schemas:
    Money:
      type: object
      title: Money
      description: |-
        An exact monetary amount.

        `value` is an INTEGER count of the currency's minor units — never a decimal, never a float. `minor_unit` is how many decimal places that currency has, and it is what makes `value` interpretable:

        - `{"value": 35000, "currency": "TRY", "minor_unit": 2}` is **₺350.00**
        - `{"value": 35000, "currency": "IRR", "minor_unit": 0}` is **35,000 rials**
        - `{"value": 35000, "currency": "BTC", "minor_unit": 8}` is **0.00035 BTC**

        `decimal` is a rendering of the same number as a string. It exists so a client can display an amount without reimplementing the scaling. It is DISPLAY ONLY — parsing it back into a number, or computing with it, defeats the reason the value is an integer in the first place.

        This is the shape used in responses. In REQUESTS, amounts are sent as a bare integer field (usually `amount`) with the currency in a sibling `currency` field.
      required:
        - value
        - currency
        - minor_unit
        - decimal
      properties:
        value:
          type: integer
          description: 'Integer amount in minor units.'
          examples:
            - 35000
        currency:
          type: string
          enum:
            - IRR
            - IRT
            - TRY
            - USD
            - EUR
            - AED
            - BTC
            - ETH
            - USDT
            - XAU
          description: 'ISO-4217-style currency code.'
        minor_unit:
          type: integer
          description: 'Decimal places for this currency: 0 for IRR/IRT, 2 for TRY/USD/EUR/AED/USDT, 4 for XAU, 8 for BTC/ETH. Do not hard-code 2.'
          examples:
            - 2
        decimal:
          type: string
          description: 'Display-only major-unit rendering. Never compute with this.'
          examples:
            - '350.00'
    MoneyBrief:
      type: object
      title: 'Money (without decimal)'
      description: 'The same amount as `Money`, but without the `decimal` convenience string. Emitted by a handful of aggregate `meta` blocks — `GET /accounts` `meta.total`, `GET /investments` `meta.current_value`/`meta.total_profit`, and `GET /assets` `meta.total_value`. Interpret `value` exactly as in `Money`.'
      required:
        - value
        - currency
        - minor_unit
      properties:
        value:
          type: integer
          description: 'Integer amount in minor units.'
        currency:
          type: string
          enum:
            - IRR
            - IRT
            - TRY
            - USD
            - EUR
            - AED
            - BTC
            - ETH
            - USDT
            - XAU
        minor_unit:
          type: integer
          description: 'Decimal places for this currency.'
    MoneyWithRate:
      type: object
      title: 'Money converted to the workspace base currency'
      description: 'A `Money` object plus the exchange rate used to reach it. Emitted as the `base` field on records that were entered in a currency other than the workspace base. The rate is recorded rather than recomputed, so a historical record keeps the rate it was actually converted at.'
      required:
        - value
        - currency
        - minor_unit
        - decimal
      properties:
        value:
          type: integer
          description: 'Integer amount in minor units of the base currency.'
        currency:
          type: string
          enum:
            - IRR
            - IRT
            - TRY
            - USD
            - EUR
            - AED
            - BTC
            - ETH
            - USDT
            - XAU
          description: 'The workspace base currency.'
        minor_unit:
          type: integer
        decimal:
          type: string
          description: 'Display only.'
        fx_rate:
          type:
            - string
            - number
            - 'null'
          description: 'Rate applied, quoted in major units: one unit of the source currency buys this many of the target.'
    BillingMoney:
      type: object
      title: 'Money (Billing module key naming)'
      description: '**Naming inconsistency, documented rather than hidden.** The Billing module serialises `App\Core\Money\Money` directly, which names the integer field `amount`. Every other module wraps it in a Resource that renames the field to `value`. Same meaning, same units — different key. Applies to `Plan.price` and `SubscriptionInvoice.amount`.'
      required:
        - amount
        - currency
        - minor_unit
        - decimal
      properties:
        amount:
          type: integer
          description: 'Integer amount in minor units. Called `value` everywhere else.'
        currency:
          type: string
          enum:
            - IRR
            - IRT
            - TRY
            - USD
            - EUR
            - AED
            - BTC
            - ETH
            - USDT
            - XAU
        minor_unit:
          type: integer
        decimal:
          type: string
          description: 'Display only.'
    Error:
      type: object
      title: 'Error envelope'
      description: 'The envelope used by domain refusals. `code` is stable, English and machine-readable; clients translate from it. `message` is developer-facing prose and must not be shown to a user.'
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: 'Stable machine-readable identifier. Always English.'
            message:
              type: string
              description: 'Developer-facing explanation. Not for display to end users.'
            details:
              type:
                - object
                - 'null'
              additionalProperties: true
              description: 'Context for the refusal, e.g. `{"given": "USD", "expected": "TRY"}`. Absent on some refusals.'
            request_id:
              type:
                - string
                - 'null'
              description: 'Echo of the `X-Request-Id` header, or null if none was sent.'
    ValidationError:
      type: object
      title: 'Framework validation error'
      description: "Laravel's own validation response. This is what a `422` looks like when the request failed field validation, and it does NOT carry an error `code`. A client must handle this shape as well as `Error`."
      required:
        - message
        - errors
      properties:
        message:
          type: string
          description: 'Summary of the first failure.'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: 'Field name to list of failure messages.'
    FrameworkError:
      type: object
      title: 'Framework error'
      description: "Laravel's default error body, returned by bare permission aborts and by `findOrFail` misses. Carries no `code`."
      required:
        - message
      properties:
        message:
          type: string
    PageMeta:
      type: object
      title: 'Pagination meta'
      required:
        - page
        - per_page
        - total
      properties:
        page:
          type: integer
          description: '1-based page number.'
        per_page:
          type: integer
          description: 'Page size. Defaults to 50, capped at 200.'
        total:
          type: integer
          description: 'Total matching records.'
    Account:
      type: object
      description: 'A place money sits.'
      required:
        - id
        - name
        - type
        - currency
        - balance
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
          description: 'ULID identifier.'
        name:
          type: string
        type:
          type: string
          enum:
            - cash
            - bank
            - card
            - wallet
            - fund
            - petty_cash
            - crypto
            - gold
            - fx
        currency:
          type: string
          enum:
            - IRR
            - IRT
            - TRY
            - USD
            - EUR
            - AED
            - BTC
            - ETH
            - USDT
            - XAU
        balance:
          $ref: '#/components/schemas/Money'
        opening_balance:
          type: integer
          description: 'Bare integer in minor units of `currency` — not a `Money` object.'
        iban:
          type:
            - string
            - 'null'
          description: 'Encrypted at rest; returned in the clear to members.'
        card_last4:
          type:
            - string
            - 'null'
        icon:
          type:
            - string
            - 'null'
        color:
          type:
            - string
            - 'null'
        is_archived:
          type: boolean
        version:
          type: integer
          description: 'Optimistic-concurrency counter. Sent back as `base_version` when syncing.'
    Category:
      type: object
      description: 'An unlimited-depth spending or income category.'
      required:
        - id
        - name
        - path
        - type
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
          description: 'ULID identifier.'
        parent_id:
          type:
            - string
            - 'null'
        name:
          type: string
        name_key:
          type:
            - string
            - 'null'
          description: "Translation key for system categories, so a seeded category renders in the user's language."
        path:
          type: string
          description: 'Materialised path, which is what makes a subtree query one indexed comparison.'
        depth:
          type: integer
        type:
          type: string
          enum:
            - income
            - expense
            - both
        icon:
          type:
            - string
            - 'null'
        color:
          type:
            - string
            - 'null'
        is_system:
          type: boolean
          description: 'Seeded on registration; not user-created.'
        children:
          type: array
          items:
            $ref: '#/components/schemas/Category'
          description: 'Present only when the list was requested with `tree=1`.'
    Transaction:
      type: object
      description: 'A double-entry transaction. Posting one writes balanced entry rows inside a single database transaction.'
      required:
        - id
        - type
        - amount
        - account_id
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
          description: 'ULID identifier.'
        type:
          type: string
          enum:
            - income
            - expense
            - transfer
        amount:
          $ref: '#/components/schemas/Money'
        base:
          $ref: '#/components/schemas/MoneyWithRate'
        account_id:
          type: string
          minLength: 26
          maxLength: 26
          description: 'ULID identifier.'
        counter_account_id:
          type:
            - string
            - 'null'
          description: 'Destination account. Required for, and only meaningful on, a transfer.'
        category_id:
          type:
            - string
            - 'null'
        account:
          type: object
          description: 'Included only when the relation was loaded.'
          properties:
            id:
              type: string
              minLength: 26
              maxLength: 26
              description: 'ULID identifier.'
            name:
              type: string
            type:
              type: string
            currency:
              type: string
        category:
          type:
            - object
            - 'null'
          description: 'Included only when the relation was loaded.'
          properties:
            id:
              type: string
              minLength: 26
              maxLength: 26
              description: 'ULID identifier.'
            name:
              type: string
