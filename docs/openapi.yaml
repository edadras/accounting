    post:
      operationId: createTripExpense
      tags:
        - Travel
      summary: 'Record a split expense'
      description: |-
        How the split is computed depends on `mode`:

        - `equal` — divided evenly between the participants
        - `percent` — `participants[].percent`, which must sum to 100
        - `weight` — `participants[].weight`
        - `exact` — `participants[].amount`, which must sum to `amount`

        In every mode the shares sum to `amount` exactly: a remainder is handed out one minor unit at a time rather than rounded away, so splitting 100 three ways gives 34/33/33.
      parameters:
        -
          name: trip
          in: path
          required: true
          schema:
            type: string
          description: 'ULID identifier.'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payer_member_id
                - amount
              properties:
                id:
                  type: string
                  minLength: 26
                  maxLength: 26
                  description: 'Optional client-generated ULID. Supplying it is what lets a record created offline keep the same id after it syncs.'
                payer_member_id:
                  type: string
                  minLength: 26
                  maxLength: 26
                  description: 'Trip member who actually paid.'
                amount:
                  type: integer
                  minimum: 1
                  description: "INTEGER in the currency's minor units. 35000 with currency TRY is ₺350.00, not ₺35,000."
                currency:
                  type: string
                  enum:
                    - IRR
                    - IRT
                    - TRY
                    - USD
                    - EUR
                    - AED
                    - BTC
                    - ETH
                    - USDT
                    - XAU
                  description: 'Defaults to the trip base currency.'
                fx_rate:
                  type: number
                  exclusiveMinimum: 0
                category_id:
                  type:
                    - string
                    - 'null'
                occurred_at:
                  type: string
                  format: date-time
                description:
                  type: string
                  maxLength: 255
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                mode:
                  type: string
                  enum:
                    - equal
                    - percent
                    - weight
                    - exact
                  description: 'Defaults to `equal`.'
                participants:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - member_id
                    properties:
                      member_id: { type: string, minLength: 26, maxLength: 26 }
                      percent: { type: number, minimum: 0, maximum: 100, description: 'For `percent` mode. Must sum to 100 across participants.' }
                      weight: { type: integer, minimum: 0, maximum: 1000, description: 'For `weight` mode.' }
                      amount: { type: integer, minimum: 0, description: 'For `exact` mode. INTEGER in minor units; must sum to the expense `amount`.' }
                  description: 'Omit to split between every trip member.'
      security:
        -
          bearerAuth: []
      responses:
        201:
          description: 'Recorded, with the computed shares.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/SplitExpense'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
