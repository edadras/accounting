                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BuildingCharge'
                  meta:
                    type: object
                    properties:
                      period: { type: string }
                      count: { type: integer }
                      already_issued: { type: boolean }
