              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                  label:
                    type:
                      - string
                      - 'null'
                  rate:
                    type: number
                    description: Percentage.
                  cap:
                    type:
                      - integer
                      - 'null'
                    description: 'INTEGER minor units.'
            employer_contributions:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                  label:
                    type:
                      - string
                      - 'null'
                  rate:
                    type: number
                    description: Percentage.
                  cap:
                    type:
                      - integer
                      - 'null'
                    description: 'INTEGER minor units.'
            fixed_deductions:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                  label:
                    type:
                      - string
                      - 'null'
                  amount:
                    type: integer
                    description: 'INTEGER minor units.'
        version:
          type: integer
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
