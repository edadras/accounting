        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                id:
                  type: string
                  minLength: 26
                  maxLength: 26
                  description: 'Optional client-generated ULID. Supplying it is what lets a record created offline keep the same id after it syncs.'
                action:
                  type: string
                  enum:
                    - buy
                    - sell
                    - dividend
                    - fee
                    - split
                quantity:
                  type: string
                  description: 'Decimal STRING, up to 8 places.'
                  pattern: '^\d+(\.\d{1,8})?$'
                price:
                  type: integer
                  description: 'Per-unit price, INTEGER in minor units.'
                  minimum: 0
                fee:
                  type: integer
                  description: 'INTEGER in minor units.'
                  minimum: 0
                currency:
                  type: string
                  enum:
                    - IRR
                    - IRT
                    - TRY
                    - USD
                    - EUR
                    - AED
                    - BTC
                    - ETH
                    - USDT
                    - XAU
                  description: 'Defaults to the position currency; a mismatch is refused rather than converted.'
                fx_rate:
                  type: number
                  description: 'Rate to the workspace base currency.'
                  exclusiveMinimum: 0
                occurred_at:
                  type: string
                  format: date-time
                notes:
                  type: string
                  maxLength: 5000
                transaction_id:
                  type: string
                  minLength: 26
                  maxLength: 26
                  description: 'Link to an existing ledger transaction.'
                idempotency_key:
                  type: string
                  description: 'Fallback for clients that cannot set the header.'
                  maxLength: 64
      security:
        -
          bearerAuth: []
      responses:
        201:
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/InvestmentTransaction'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  /api/v1/invitations:
    get:
      operationId: listInvitations
      tags:
        - Core
      summary: 'List invitations'
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'Invitations. `token` is never included here — only at creation.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/WorkspaceForbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createInvitation
      tags:
        - Core
      summary: 'Invite someone'
      description: 'The plaintext `token` is returned ONCE, on this response. Only its hash is stored, so a leaked database hands nobody a working link.'
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - role
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 190
                  description: "The accepting user's email must match this — holding the link is deliberately not enough."
                role:
                  type: string
                  enum:
                    - admin
                    - accountant
                    - member
                    - viewer
                  description: 'Never `owner`: `cannot_invite_as_owner`.'
      security:
        -
          bearerAuth: []
      responses:
        201:
          description: 'Invited. Copy `token` now.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Invitation'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/WorkspaceForbidden'
        409:
          description: '`already_member` or `already_invited`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  '/api/v1/invitations/{id}':
