          type: string
          minLength: 26
          maxLength: 26
          description: 'The account the net pay is drawn from.'
        category_id:
          type:
            - string
            - 'null'
        is_posted:
          type: boolean
          description: 'False for a draft.'
        net_transaction_id:
          type:
            - string
            - 'null'
          description: 'Set once on approval. Approving twice does not post twice.'
        liability_transaction_id:
          type:
            - string
            - 'null'
