        country:
          type:
            - string
            - 'null'
        tax_rules_name:
          type:
            - string
            - 'null'
          description: 'The rule set applied, recorded on the payslip so a later rule change cannot silently restate a past run.'
        employee:
          type:
            - object
            - 'null'
          properties:
            id:
              type: string
              minLength: 26
              maxLength: 26
              description: 'ULID identifier.'
            name:
              type: string
            job_title:
              type:
                - string
                - 'null'
        lines:
          type: array
          description: 'Only when the relation was loaded.'
