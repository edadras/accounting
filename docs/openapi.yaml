  '/api/v1/reports/{type}/export':
    post:
      operationId: exportReport
      tags:
        - Reports
      summary: 'Export a report'
      description: |-
        Answers one of two ways, and a client must handle both:

        - **202** with a `ReportExport` record, when the export was queued — either because `queued: true` was sent or because the result is larger than the inline row limit for the format. Poll `GET /reports/exports/{id}` and use its `download_url`.
        - **200** with the file bytes, when it was small enough to build inline.

        Pass `queued: true` if you want an id you can poll and a link you can hand to a user; an inline export gives you neither.
      parameters:
        -
          name: type
          in: path
          required: true
          schema:
            type: string
          description: 'ULID identifier.'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - format
              properties:
                format:
                  type: string
                  enum:
                    - csv
                    - xlsx
                    - pdf
                  description: "XLSX writes amounts as numbers with a currency format, so a column can be summed. CSV writes plain decimals with no thousands separator, which would make the file unparseable in half the world's locales."
                locale:
                  type: string
                  enum:
                    - fa
                    - en
                    - tr
                    - ar
                  description: 'Language of the FILE, chosen separately from the app language. Default `fa`.'
                queued:
                  type: boolean
                  description: 'Force the queued path.'
                from:
                  type: string
                  format: date
                to:
                  type: string
                  format: date
                bucket:
                  type: string
                  enum:
                    - day
                    - week
                    - month
                    - year
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                depth:
                  type: integer
                  minimum: 1
                  maximum: 10
                flow:
                  type: string
                  enum:
                    - income
                    - expense
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'The file itself, when built inline. `X-Report-Export-Id` carries the export id.'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
              description: '`attachment; filename="..."`'
        202:
          description: 'Queued. Poll the returned record.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ReportExport'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/WorkspaceForbidden'
        404:
          description: 'Unknown report type.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  /api/v1/search:
    get:
      operationId: search
      tags:
        - Search
