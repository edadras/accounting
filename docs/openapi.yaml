                  type: string
                  enum:
                    - IRR
                    - IRT
                    - TRY
                    - USD
                    - EUR
                    - AED
                    - BTC
                    - ETH
                    - USDT
                    - XAU
                  description: 'Required when `amount` is given.'
                paid_at:
                  type: string
                  format: date-time
