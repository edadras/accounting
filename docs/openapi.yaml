      description: 'Owner and admin only. Append-only: entries cannot be edited or deleted through any endpoint, because a trail you can quietly edit is not a trail.'
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        -
          name: action
          in: query
          required: false
          schema:
            type: string
          description: ''
        -
          name: subject_type
          in: query
          required: false
          schema:
            type: string
          description: ''
        -
          name: subject_id
          in: query
          required: false
          schema:
            type: string
          description: ''
        -
          name: user_id
          in: query
          required: false
          schema:
            type: integer
          description: ''
        -
          name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: '`created_at >=`.'
        -
          name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: '`created_at <=`.'
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            maximum: 200
          description: 'Page size. Default 50, maximum 200.'
        -
          name: page
          in: query
          required: false
          schema:
            type: integer
          description: '1-based page number.'
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'A page of entries.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/2fa:
    get:
      operationId: getTwoFactorStatus
      tags:
        - Security
      summary: 'Two-factor status'
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: Status.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/TwoFactorStatus'
        401:
          $ref: '#/components/responses/Unauthenticated'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/2fa/confirm:
    post:
      operationId: confirmTwoFactor
      tags:
        - Security
      summary: 'Confirm two-factor'
      description: 'Activates the secret and returns the recovery codes. They are shown ONCE — codes that scroll away unread are the same as no codes at all on the day the phone is lost.'
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: 'Current TOTP code.'
                  maxLength: 16
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: Confirmed.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      confirmed_at: { type: string, format: date-time }
                      recovery_codes: { type: array, items: { type: string }, description: 'Single-use. Returned once and never again.' }
        401:
          $ref: '#/components/responses/Unauthenticated'
        409:
          description: '`two_factor_already_enabled` or `two_factor_not_enabled`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/2fa/disable:
    post:
      operationId: disableTwoFactor
      tags:
        - Security
      summary: 'Disable two-factor'
      description: 'Requires the password or a current code — at least one. Turning off a second factor must not be easier than turning it on.'
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: 'Account password.'
                code:
                  type: string
                  description: 'Current TOTP or recovery code.'
                  maxLength: 32
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: Disabled.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      two_factor_enabled: { type: boolean, enum: [false] }
        401:
          $ref: '#/components/responses/Unauthenticated'
        409:
          description: '`two_factor_not_enabled`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/2fa/enable:
    post:
      operationId: enableTwoFactor
      tags:
        - Security
      summary: 'Begin enabling two-factor'
      description: 'Issues a TOTP secret. It is NOT active until confirmed with a code — otherwise a mis-scanned QR would lock the user out of their own account.'
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'Secret issued, awaiting confirmation.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      secret: { type: string, description: 'Base32 TOTP secret. Encrypted at rest.' }
                      otpauth_uri: { type: string, description: 'Render as a QR code.' }
                      confirmed: { type: boolean, enum: [false] }
        401:
          $ref: '#/components/responses/Unauthenticated'
        409:
          description: '`two_factor_already_enabled`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/2fa/verify:
    post:
      operationId: verifyTwoFactor
      tags:
        - Security
      summary: 'Exchange a two-factor challenge for a token'
      description: 'The second half of sign-in when two-factor is on. Accepts a TOTP code or a single-use recovery code.'
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - challenge
                - code
              properties:
                challenge:
                  type: string
                  description: 'The challenge string from `POST /auth/login`.'
                code:
                  type: string
                  description: 'TOTP or recovery code.'
                  maxLength: 32
      security: []
      responses:
        200:
          description: 'Signed in.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSuccess'
        401:
          description: '`two_factor_challenge_invalid` — expired or unknown challenge.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      tags:
        - Security
      summary: 'Request a password reset'
      description: 'Answers identically for a known and an unknown address. A different answer would tell an attacker which addresses are registered.'
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 190
      security: []
      responses:
        200:
          description: 'Always this, whether or not the address exists.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [password_reset_link_sent] }
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
        - Core
      summary: 'Sign in'
      description: "**Two different 200 bodies.** With two-factor confirmed, this returns a CHALLENGE and no token — exchange it at `POST /auth/2fa/verify`. Without, it returns the token and the user's workspaces. Check for `two_factor_required` before reading `token`."
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        -
          name: X-Device-Name
          in: header
          required: false
          schema:
            type: string
            maxLength: 120
          description: 'Names the issued token, so a user can tell their devices apart when revoking one.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      security: []
      responses:
        200:
          description: 'Signed in, OR a two-factor challenge.'
          content:
            application/json:
              schema:
                oneOf:
                  -
                    type: object
                    required:
                      - data
                    properties:
                      data: { $ref: '#/components/schemas/AuthSuccess' }
                  -
                    type: object
                    required:
                      - data
                    properties:
                      data: { type: object, required: [two_factor_required, challenge], properties: { two_factor_required: { type: boolean, enum: [true] }, challenge: { type: string, description: 'Short-lived; exchange at `/auth/2fa/verify`.' }, expires_at: { type: string, format: date-time } } }
        401:
          description: '`invalid_credentials`. The same answer for an unknown email and a wrong password, so the endpoint cannot be used to discover which addresses are registered.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: '`account_pending_deletion` — the account is inside its deletion grace period. `details.purge_after` says until when; `POST /me/restore` cancels it.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
        - Core
      summary: 'Sign out'
      description: "Revokes the current access token only, leaving the user's other devices signed in."
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        -
          bearerAuth: []
      responses:
        204:
          description: 'Signed out.'
        401:
          $ref: '#/components/responses/Unauthenticated'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/register:
    post:
      operationId: register
      tags:
        - Core
      summary: Register
      description: 'Creates the user, seeds a personal workspace with a wallet account and a three-level category tree, and returns a token. The `token` is shown once.'
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  maxLength: 120
                email:
                  type: string
                  format: email
                  maxLength: 190
                password:
                  type: string
                  minLength: 8
                locale:
                  type: string
                  enum:
                    - fa
                    - en
                    - tr
                    - ar
                  description: 'Default `fa`.'
                base_currency:
                  type: string
                  description: 'Base currency for the seeded workspace. Default `IRR`.'
                  maxLength: 8
      security: []
      responses:
        201:
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSuccess'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags:
        - Security
      summary: 'Reset a password'
      description: 'Revokes every existing token on success, so a session an attacker already has does not survive the reset.'
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - token
                - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 190
                token:
                  type: string
                  description: 'Reset token from the email.'
                password:
                  type: string
                  description: 'New password.'
                  minLength: 8
      security: []
      responses:
        200:
          description: Reset.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [password_reset] }
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
