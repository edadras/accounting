      description: "Paying more than the instalment's remaining balance is refused with `installment_overpayment` rather than absorbed. Note this endpoint reads the `idempotency_key` BODY field only — it does not read the `Idempotency-Key` header."
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 26
            maxLength: 26
          description: 'Loan ULID.'
        -
          name: number
          in: path
          required: true
          schema:
            type: integer
          description: '1-based instalment number within the schedule.'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: integer
                  minimum: 1
                  description: "INTEGER in the currency's minor units. 35000 with currency TRY is ₺350.00, not ₺35,000. May be a partial payment."
                paid_at:
                  type: string
                  format: date-time
                penalty:
                  type: integer
                  description: 'Late-payment penalty, INTEGER in minor units.'
                  minimum: 0
                notes:
                  type: string
                idempotency_key:
                  type: string
                  description: 'Retry-safety key. This endpoint reads the body field, not the header.'
                  maxLength: 64
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'The updated instalment, with the loan in `meta`.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/LoanInstallment'
                  meta:
                    type: object
                    properties:
                      loan: { $ref: '#/components/schemas/Loan' }
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
