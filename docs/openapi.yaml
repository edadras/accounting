  /api/v1/capture/email:
    post:
      operationId: captureEmailWebhook
      tags:
        - Capture
      summary: 'Inbound email webhook'
      description: |-
        Called by the mail provider, not by a client — it uses a shared secret rather than a Sanctum token, and takes no `X-Workspace-Id`; the workspace is resolved from the recipient ingest alias.

        Authenticate with EITHER:
        - `X-Capture-Signature: sha256=<hmac>` — HMAC-SHA256 of the RAW request body, keyed with the shared secret. Preferred; checked first when present.
        - `X-Capture-Secret: <secret>` — the plain shared secret.

        If no secret is configured the endpoint fails closed with `503 capture_webhook_not_configured` rather than accepting anything.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        -
          name: X-Capture-Signature
          in: header
          required: false
          schema:
            type: string
          description: '`sha256=` followed by the hex HMAC-SHA256 of the raw body. Compared in constant time.'
        -
          name: X-Capture-Secret
          in: header
          required: false
          schema:
            type: string
          description: 'Plain shared secret. Used only when no signature header is present.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
              properties:
                to:
                  type: string
                  description: 'Recipient ingest address; identifies the workspace.'
                  maxLength: 191
                from:
                  type: string
                  maxLength: 191
                subject:
                  type: string
                  maxLength: 500
                text:
                  type: string
                  description: 'Plain-text body.'
                  maxLength: 20000
                message_id:
                  type: string
                  description: 'Used to detect a redelivered message.'
                  maxLength: 191
                received_at:
                  type: string
                  format: date-time
                attachments:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required:
                      - filename
                      - content
                    properties:
                      filename: { type: string, maxLength: 191 }
                      content_type: { type: [string, 'null'], maxLength: 191 }
                      content: { type: string, description: 'Attachment bytes inline as a string — this endpoint is JSON, not multipart.' }
      security: []
      responses:
        201:
          description: Captured.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CaptureMessage'
        401:
          description: '`capture_webhook_unauthorized` — bad or missing signature/secret.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: '`capture_unknown_recipient` — no ingest alias matches `to`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        413:
          description: '`capture_attachment_too_large`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
        503:
          description: '`capture_webhook_not_configured` — no secret set, so the endpoint refuses everything.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
