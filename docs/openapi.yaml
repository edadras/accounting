            - 'null'
        limit:
          type:
            - integer
            - 'null'
    Report:
      type: object
      title: 'Report payload'
      description: |-
        Shape varies by report type. Every payload carries `report` (the type) and `meta`; the rest depends:

        - `cash-flow` — `periods[]` of `{key, start, end, income, expense, net, transaction_count}` and `totals`
        - `net-worth` — `total`, `accounts[]` of `{account_id, name, type, balance, base_balance, archived}`, `series[]` of `{key, start, end, net_worth}`
        - `expense-trend` / `income-trend` — `periods[]` of `{key, start, end, total, transaction_count}` and `totals` including `average_per_period`
        - `top-categories` — `categories[]` of `{rank, category_id, path, name, depth, total, transaction_count, percentage}`, plus `other` and `totals`
        - `top-merchants` — `merchants[]` of `{rank, payee, total, transaction_count, percentage}`, plus `unlabelled` and `totals`
        - `top-accounts` — `accounts[]` of `{rank, account_id, name, type, currency, total, transaction_count, percentage}` and `totals`
        - `category-breakdown` — `slices[]` of `{category_id, path, name, depth, total, transaction_count, percentage}` and `totals`; a trailing remainder slice has `category_id: null` and `name: "other"`

        Every `total`, `income`, `expense`, `net` and `net_worth` field is a `Money` object. Transfers are excluded from every report — moving your own money between your own accounts is not income and not spending.
      required:
        - report
        - meta
      properties:
        report:
          type: string
          enum:
            - cash-flow
            - net-worth
            - expense-trend
            - income-trend
            - top-categories
            - top-merchants
            - top-accounts
            - category-breakdown
        meta:
          $ref: '#/components/schemas/ReportMeta'
      additionalProperties: true
