                day_of_week:
                  type: integer
                  description: 0-6.
                  minimum: 0
                  maximum: 6
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
                auto_post:
                  type: boolean
                  description: 'Post automatically rather than only proposing. Default true.'
                is_paused:
                  type: boolean
                  description: 'Default false.'
      security:
        -
          bearerAuth: []
      responses:
        201:
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/RecurringRule'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  '/api/v1/recurring-rules/{rule}':
    delete:
      operationId: deleteRecurringRule
      tags:
        - Recurring
      summary: 'Delete a recurring rule'
      parameters:
        -
          name: rule
          in: path
          required: true
          schema:
            type: string
          description: 'ULID identifier.'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        -
          bearerAuth: []
      responses:
        204:
          description: 'Deleted. Already-posted occurrences are untouched.'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          description: '`recurring_rule_not_found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
    patch:
      operationId: updateRecurringRule
      tags:
        - Recurring
      summary: 'Update a recurring rule'
      description: 'The schedule and the template are editable. Already-posted occurrences are never rewritten — a rule that has run keeps its cursor, so moving `starts_at` afterwards changes nothing about what was already posted and cannot replay or skip an occurrence.'
      parameters:
        -
          name: rule
          in: path
          required: true
          schema:
            type: string
          description: 'ULID identifier.'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 120
                ends_at:
                  type: string
                  format: date-time
                auto_post:
                  type: boolean
                is_paused:
                  type: boolean
                template:
                  type: object
                  required:
                    - type
                    - account_id
                    - amount
                    - currency
                  properties:
                    type:
                      type: string
                      enum: [income, expense, transfer]
                    account_id:
                      type: string
                      minLength: 26
                      maxLength: 26
                      description: 'The account the occurrence posts to.'
                    counter_account_id:
                      type: string
                      minLength: 26
                      maxLength: 26
                      description: 'The other side, for a transfer.'
                    category_id:
                      type: string
                      minLength: 26
                      maxLength: 26
                      description: 'Category for the posted transaction.'
                    amount:
                      type: integer
                      description: "INTEGER in the currency's minor units."
                      minimum: 1
                    currency:
                      type: string
                      enum: [IRR, IRT, TRY, USD, EUR, AED, BTC, ETH, USDT, XAU]
                      description: 'Currency of the occurrence.'
                    description:
                      type: string
                      maxLength: 255
                    payee:
                      type: string
                      maxLength: 255
                    tags:
                      type: array
                      items: { type: string }
                frequency:
                  type: string
                  enum:
                    - daily
                    - weekly
                    - monthly
                    - yearly
                interval:
                  type: integer
                  description: 'Every N periods.'
                  minimum: 1
                  maximum: 365
                day_of_month:
                  type: integer
                  description: 'Clamped to the length of a short month.'
                  minimum: 1
                  maximum: 31
                day_of_week:
                  type: integer
                  description: '0 = Sunday. Honoured for a weekly rule; the occurrence is placed on this day within the week the interval lands in, so the interval stays exact.'
                  minimum: 0
                  maximum: 6
                starts_at:
                  type: string
                  format: date
                  description: 'Only moves the cursor on a rule that has not run yet.'
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/RecurringRule'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          description: '`recurring_rule_not_found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
