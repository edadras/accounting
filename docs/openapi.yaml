  '/api/v1/invitations/{token}/accept':
    post:
      operationId: acceptInvitation
      tags:
        - Core
      summary: 'Accept an invitation'
      description: 'Not workspace-scoped — this is how someone gets INTO a workspace, so it cannot require already being in one; the token identifies the workspace. An unknown token answers exactly as a revoked one does, so the endpoint cannot be used to probe which tokens exist.'
      parameters:
        -
          name: token
          in: path
          required: true
          schema:
            type: string
          description: 'The plaintext invitation token from the invitation email or link.'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        -
          bearerAuth: []
      responses:
        201:
          description: Joined.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      workspace_id: { type: string }
                      role: { type: string }
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          description: '`invitation_email_mismatch` — the invitation was issued to a different address.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: '`invitation_invalid` — unknown, revoked or expired. Identical for all three.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  /api/v1/invoices:
    get:
      operationId: listInvoices
      tags:
        - Business
      summary: 'List invoices'
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        -
          name: direction
          in: query
          required: false
          schema:
            type: string
            enum:
              - sale
              - purchase
          description: ''
        -
          name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - draft
              - sent
              - partial
              - paid
              - overdue
              - void
          description: ''
        -
          name: contact_id
          in: query
          required: false
          schema:
            type: string
          description: ''
        -
          name: project_id
          in: query
          required: false
          schema:
            type: string
          description: ''
        -
          name: open
          in: query
          required: false
          schema:
            type: boolean
          description: 'Only invoices with an outstanding balance.'
        -
          name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: '`issue_date >=`.'
        -
          name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: '`issue_date <=`.'
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            maximum: 200
          description: 'Page size. Default 50, maximum 200.'
        -
          name: page
          in: query
          required: false
          schema:
            type: integer
          description: '1-based page number.'
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'A page of invoices.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/WorkspaceForbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createInvoice
      tags:
        - Business
      summary: 'Create an invoice'
      description: 'Totals are computed server-side from the lines and re-checked before the invoice is stored; a mismatch is a `500 inconsistent_invoice_totals` rather than a saved invoice that does not add up.'
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - direction
                - currency
                - items
              properties:
                id:
                  type: string
                  minLength: 26
                  maxLength: 26
                  description: 'Optional client-generated ULID. Supplying it is what lets a record created offline keep the same id after it syncs.'
                number:
                  type: string
                  description: 'Allocated automatically when omitted. A duplicate is `409 duplicate_invoice_number`.'
                  maxLength: 64
                direction:
                  type: string
                  enum:
                    - sale
                    - purchase
                contact_id:
                  type:
                    - string
                    - 'null'
                project_id:
                  type:
                    - string
                    - 'null'
                issue_date:
                  type: string
                  format: date
                due_date:
                  type: string
                  format: date
                currency:
                  type: string
                  enum:
                    - IRR
                    - IRT
                    - TRY
                    - USD
                    - EUR
                    - AED
                    - BTC
                    - ETH
                    - USDT
                    - XAU
                  description: 'Currency of every amount on this invoice.'
                fx_rate:
                  type: number
                  description: 'Rate to the workspace base currency.'
                  exclusiveMinimum: 0
                discount:
                  type: integer
                  description: 'Header discount, INTEGER in minor units, allocated across the lines. Must not exceed the subtotal.'
                  minimum: 0
                status:
                  type: string
                  enum:
                    - draft
                    - sent
                notes:
                  type: string
                  maxLength: 5000
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required:
                      - description
                      - quantity
                      - unit_price
                    properties:
                      description: { type: string, maxLength: 255 }
                      quantity: { type: number, exclusiveMinimum: 0 }
                      unit_price: { type: integer, minimum: 0, description: 'INTEGER in minor units.' }
                      discount: { type: integer, minimum: 0, description: 'Per-line discount, INTEGER in minor units. May not exceed the line total.' }
                      tax_rate: { type: number, minimum: 0, maximum: 100, description: 'Percentage, applied per line.' }
                      sort_order: { type: integer, minimum: 0 }
      security:
        -
          bearerAuth: []
      responses:
        201:
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Invoice'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
