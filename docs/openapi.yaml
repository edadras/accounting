        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  /api/v1/sync/pull:
    get:
      operationId: syncPull
      tags:
        - Sync
      summary: 'Pull server changes'
      description: 'Cursor-paged delta feed, totally ordered on `(updated_at, entity, id)` so no record can be skipped or repeated across pages. Follow `next_cursor` until it is null, then keep `server_time` as the next `since`.'
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        -
          name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: 'Return changes after this instant. Omit for a full backfill. Unparseable → `422 invalid_timestamp`.'
        -
          name: cursor
          in: query
          required: false
          schema:
            type: string
          description: "Opaque cursor from the previous page's `next_cursor`. Tampered values → `422 invalid_cursor`."
        -
          name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 200
          description: '1-200, default 100.'
        -
          name: device_id
          in: query
          required: false
          schema:
            type: string
          description: 'Calling device. Falls back to `X-Device-Id`.'
        -
          name: X-Device-Id
          in: header
          required: false
          schema:
            type: string
            maxLength: 64
          description: 'Calling device.'
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'A page of changes.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncChange'
                  next_cursor:
                    type:
                      - string
                      - 'null'
                    description: 'Null when the feed is exhausted.'
                  server_time:
                    type: string
                    description: '`YYYY-MM-DDTHH:MM:SSZ`. The server clock, so a skewed device cannot silently miss changes.'
                  meta:
                    type: object
                    properties:
                      limit: { type: integer }
                      count: { type: integer }
                      since: { type: [string, 'null'] }
                      request_id: { type: [string, 'null'] }
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/WorkspaceForbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  /api/v1/sync/push:
    post:
      operationId: syncPush
      tags:
        - Sync
      summary: 'Push local changes'
      description: |-
        Uploads a batch of offline changes and answers with one verdict per change, in order.

        The rule this endpoint exists to enforce: **a disagreement about an amount, currency, account or date is never auto-resolved.** It comes back as `status: "conflict"` with the server's version in `server_payload`, for a person to settle. Non-financial fields merge last-write-wins.

        `base_version` is the `version` the client last saw. A stale one is what makes a conflict detectable at all.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        -
          name: X-Device-Id
          in: header
          required: false
          schema:
            type: string
            maxLength: 64
          description: 'Calling device. The `device_id` body field is read first, then this header.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - changes
              properties:
                device_id:
                  type: string
                  description: 'Calling device. Falls back to the `X-Device-Id` header.'
                  maxLength: 64
                changes:
                  type: array
                  maxItems: 500
                  description: 'Batch size is capped by `sync.max_batch` (500 by default).'
                  items:
                    type: object
                    required:
                      - entity
                      - id
                      - op
                      - base_version
                    properties:
                      entity: { type: string, enum: [transaction, account, category, budget], description: 'Only whitelisted entities sync.' }
                      id: { type: string, maxLength: 64, description: 'The client-generated ULID.' }
                      op: { type: string, enum: [create, update, delete] }
                      base_version: { type: integer, minimum: 0, description: 'Version the client last saw. 0 for a create.' }
                      payload: { type: object, additionalProperties: true, description: "The record's fields. Required unless `op` is `delete`. Money fields are bare integers in minor units with a sibling currency field." }
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'One verdict per pushed change.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PushVerdict'
                  server_time:
                    type: string
                    description: '`YYYY-MM-DDTHH:MM:SSZ`. Use as the next `since`.'
                  meta:
                    type: object
                    properties:
                      device_id: { type: [string, 'null'] }
                      request_id: { type: [string, 'null'] }
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
  /api/v1/transactions:
    get:
      operationId: listTransactions
      tags:
        - Ledger
      summary: 'List transactions'
      description: 'Filtering by `category_id` includes the whole subtree — filtering by "Food" returns Restaurants and Groceries too, otherwise every parent category would read as empty.'
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        -
          name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - income
              - expense
              - transfer
          description: ''
        -
          name: account_id
          in: query
          required: false
          schema:
            type: string
          description: ''
        -
          name: category_id
          in: query
          required: false
          schema:
            type: string
          description: 'Matches the category and everything beneath it.'
        -
          name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: '`occurred_at >=`.'
        -
          name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: '`occurred_at <=`.'
        -
          name: q
          in: query
          required: false
          schema:
            type: string
          description: 'Substring match over description, payee and notes.'
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            maximum: 200
          description: 'Page size. Default 50, maximum 200.'
        -
          name: page
          in: query
          required: false
          schema:
            type: integer
          description: '1-based page number.'
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'A page of transactions. `entries` are not included here — request one transaction to see its double-entry rows.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/WorkspaceForbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createTransaction
      tags:
        - Ledger
      summary: 'Record a transaction'
      description: |-
        Posts balanced double-entry rows inside one database transaction.

        `amount` is always POSITIVE — direction is carried by `type`, not by the sign. A negative amount is refused (`negative_amount`), as is zero (`zero_amount`).

        This endpoint honours `Idempotency-Key`; the header takes precedence over the `idempotency_key` body field, because the header is what a retry layer actually sets.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - account_id
                - amount
                - currency
              properties:
                id:
                  type: string
                  minLength: 26
                  maxLength: 26
                  description: 'Optional client-generated ULID. Supplying it is what lets a record created offline keep the same id after it syncs.'
                type:
                  type: string
                  enum:
                    - income
                    - expense
                    - transfer
                account_id:
                  type: string
                  minLength: 26
                  maxLength: 26
                  description: 'Source account. Must be in this workspace.'
                counter_account_id:
                  type:
                    - string
                    - 'null'
                  description: 'Destination account. Required for a transfer, and must differ from `account_id`.'
                category_id:
                  type:
                    - string
                    - 'null'
                amount:
                  type: integer
                  minimum: 1
                  description: "INTEGER in the currency's minor units. 35000 with currency TRY is ₺350.00, not ₺35,000. Always positive; `type` carries the direction."
                currency:
                  type: string
                  enum:
                    - IRR
                    - IRT
                    - TRY
                    - USD
                    - EUR
                    - AED
                    - BTC
                    - ETH
                    - USDT
                    - XAU
                  description: 'Must match the account currency, or the request is refused with `currency_mismatch` rather than silently converted.'
                fx_rate:
                  type: number
                  description: 'Rate to the workspace base currency, in major units. Required when the currencies differ, because the ledger will not guess a rate.'
                  exclusiveMinimum: 0
                occurred_at:
                  type: string
                  format: date-time
                  description: 'When the money moved. Defaults to now.'
                description:
                  type: string
                  maxLength: 255
                notes:
                  type: string
                  maxLength: 5000
                payee:
                  type: string
                  maxLength: 255
                reference:
                  type: string
                  maxLength: 255
                tags:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    maxLength: 40
                source:
                  type: string
                  enum:
                    - manual
                    - voice
                    - ocr
                    - sms
                    - email
                    - qr
                    - import
                    - recurring
                    - api
                source_meta:
                  type: object
                  additionalProperties: true
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                idempotency_key:
                  type: string
                  description: 'Fallback for clients that cannot set the header.'
                  maxLength: 64
      security:
        -
          bearerAuth: []
      responses:
        201:
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Transaction'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
