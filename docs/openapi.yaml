          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createTaxRule
      tags:
        - Payroll
      summary: 'Create a tax rule set'
      description: 'Brackets, contributions and fixed deductions are data, not code. A payslip records the name of the rule set that produced it, so amending a rule set cannot silently restate a run that has already been approved.'
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - country
                - rules
              properties:
                id:
                  type: string
                  minLength: 26
                  maxLength: 26
                  description: 'Optional client-generated ULID. Supplying it is what lets a record created offline keep the same id after it syncs.'
                country:
                  type: string
                  description: 'ISO 3166-1 alpha-2.'
                  minLength: 2
                  maxLength: 2
                name:
                  type: string
                  maxLength: 255
                currency:
                  type: string
                  enum:
                    - IRR
                    - IRT
                    - TRY
                    - USD
                    - EUR
                    - AED
                    - BTC
                    - ETH
                    - USDT
                    - XAU
                  description: 'Currency the caps and fixed amounts are expressed in.'
                effective_from:
                  type: string
                  format: date
                is_active:
                  type: boolean
                  description: 'Only one active set per country is used by a run.'
                rules:
                  type: object
                  properties:
                    tax_base:
                      type: string
                      enum: [gross, gross_less_employee_contributions]
                      description: 'What the brackets are applied to.'
                    brackets:
                      type: array
                      maxItems: 20
                      items: { type: object, required: [rate], properties: { up_to: { type: integer, description: 'Upper bound, INTEGER minor units. Omit on the top bracket.', minimum: 0 }, rate: { type: number, description: Percentage., minimum: 0, maximum: 100 } } }
                    employee_contributions:
                      type: array
                      maxItems: 20
                      items: { type: object, required: [code, rate], properties: { code: { type: string, maxLength: 64 }, label: { type: string, maxLength: 255 }, rate: { type: number, description: Percentage., minimum: 0, maximum: 100 }, cap: { type: integer, description: 'INTEGER minor units.', minimum: 0 } } }
                    employer_contributions:
                      type: array
                      maxItems: 20
                      items: { type: object, required: [code, rate], properties: { code: { type: string, maxLength: 64 }, label: { type: string, maxLength: 255 }, rate: { type: number, description: Percentage., minimum: 0, maximum: 100 }, cap: { type: integer, description: 'INTEGER minor units.', minimum: 0 } } }
                    fixed_deductions:
                      type: array
                      maxItems: 20
                      items: { type: object, required: [code, amount], properties: { code: { type: string, maxLength: 64 }, label: { type: string, maxLength: 255 }, amount: { type: integer, description: 'INTEGER minor units.', minimum: 0 } } }
      security:
        -
          bearerAuth: []
      responses:
        201:
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/TaxRuleSet'
        400:
          $ref: '#/components/responses/WorkspaceRequired'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
