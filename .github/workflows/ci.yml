name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (PHP 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Redis backs the queue Horizon supervises; the suite runs on array/sync
    # drivers, but the config must still resolve against a real connection.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_sqlite, sqlite3, redis, zip, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      # A migration that cannot be undone turns a bad deploy into a restore
      # from backup, so reversibility is checked on every push, not hoped for.
      - name: Check migrations roll back and re-apply
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --step=40 --force
          php artisan migrate --force

      - name: Tests
        run: ./vendor/bin/phpunit

      - name: Formatting
        run: ./vendor/bin/pint --test

      - name: Dependency advisories
        run: composer audit --no-interaction

  app:
    name: Flutter client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.29.0"

      - run: flutter pub get
      - run: flutter analyze

      # Goldens included: a mirrored RTL layout or a colour that stopped
      # meaning what it meant passes every behavioural assertion, and only an
      # image comparison catches it.
      - run: flutter test

      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: app/test/failures/
          if-no-files-found: ignore
