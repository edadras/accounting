name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (PHP 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Redis backs the queue Horizon supervises; the suite runs on array/sync
    # drivers, but the config must still resolve against a real connection.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_sqlite, sqlite3, redis, zip, bcmath
          # PCOV rather than Xdebug: the suite runs several times faster under
          # it, and nothing here needs a step debugger. Without a driver
          # PHPUnit emits a warning and still exits 0, so the coverage step
          # below would silently report nothing.
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      # A migration that cannot be undone turns a bad deploy into a restore
      # from backup, so reversibility is checked on every push, not hoped for.
      #
      # `migrate:reset` rather than `rollback --step=N`: a fixed step silently
      # stops covering the oldest migrations as soon as the count passes N, and
      # the step that no longer reverses anything still exits 0.
      - name: Check migrations roll back and re-apply
        run: |
          php artisan migrate --force
          php artisan migrate:reset --force
          php artisan migrate --force

      - name: Tests with coverage
        # Targets per area are recorded in backend/phpunit.xml; they are read
        # from this report rather than enforced as one repo-wide threshold,
        # which would let a well-covered module pay for a bare one.
        # Report destinations come from phpunit.xml; --coverage-text only adds
        # the summary to the job log.
        run: ./vendor/bin/phpunit --coverage-text

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/storage/coverage/
          if-no-files-found: warn

      - name: Formatting
        run: ./vendor/bin/pint --test

      # docs/10-quality-and-dod.md §5 step 2. Invoked directly rather than
      # through `composer analyse` so a missing binary fails here with an
      # obvious message instead of being reported as a composer script error.
      - name: Static analysis (PHPStan level 8)
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Dependency advisories
        run: composer audit --no-interaction

      # docs/10-quality-and-dod.md §5 step 7. Lives in the backend job because
      # PHP is already set up here; the file it reads belongs to the client, so
      # the path reaches up out of the working directory.
      - name: Translation key parity (fa/en/tr/ar)
        run: php scripts/check-translation-keys.php

  app:
    name: Flutter client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.29.0"

      - run: flutter pub get
      - run: flutter analyze

      # Goldens included: a mirrored RTL layout or a colour that stopped
      # meaning what it meant passes every behavioural assertion, and only an
      # image comparison catches it.
      - run: flutter test

      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: app/test/failures/
          if-no-files-found: ignore
