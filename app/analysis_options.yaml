include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # RTL correctness is not a style preference in this product — a directional
    # padding used as a physical one breaks every Persian and Arabic screen.
    use_named_constants: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_single_quotes
    - prefer_const_constructors
    - prefer_const_declarations
    - require_trailing_commas
    - unawaited_futures
    - use_super_parameters
